services:
  jobhunt:
    build: .
    image: jobhunt:local
    ports:
      - "127.0.0.1:8650:8650"
    environment:
      JOBHUNT_WEB_HOME: /data
      JOBHUNT_WEB_SECRET: ${JOBHUNT_WEB_SECRET:?Set a stable random JOBHUNT_WEB_SECRET before starting}
      JOBHUNT_WEB_SECURE_COOKIES: ${JOBHUNT_WEB_SECURE_COOKIES:-0}
      JOBHUNT_WEB_ORIGINS: ${JOBHUNT_WEB_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:5174,http://localhost:5174}
      JOBHUNT_WEB_HOSTS: ${JOBHUNT_WEB_HOSTS:-localhost,127.0.0.1}
    volumes:
      - jobhunt-data:/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /run/jobhunt:rw,noexec,nosuid,size=64m,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  jobhunt-data:
