# Multiple-choice questions for `jobhunt assess <skill>`. answer = 0-based option index.
# Skills without questions fall back to a structured self-assessment. Contributions welcome!
Python:
  - q: What does a list comprehension `[x*x for x in range(3)]` return?
    options: ["[0, 1, 4]", "[1, 4, 9]", "(0, 1, 4)", "a generator"]
    answer: 0
  - q: Which structure gives average O(1) membership tests?
    options: [list, tuple, set, "str"]
    answer: 2
  - q: What is the main effect of the GIL in CPython?
    options: ["Prevents multiprocessing", "Only one thread executes Python bytecode at a time", "Disables async", "Limits memory"]
    answer: 1
  - q: Why is `def f(x, items=[])` risky?
    options: ["Syntax error", "Default list is shared across calls", "Lists can't be defaults", "It is slow"]
    answer: 1
    why: default values are evaluated once at definition time
  - q: Which keyword turns a function into a generator?
    options: [return, yield, async, lambda]
    answer: 1
