# Skill taxonomy used to extract skills from CVs and job descriptions.
# weight: how much a skill typically matters when it is listed (1.0 = normal, 2.0 = core/hard requirement).
# case_sensitive: match the skill name with exact case (avoids "go"/"rust"/"spring" false positives).
# cs_aliases: extra exact-case aliases. Add your own domain skills here.
Python: {category: language, weight: 2.0, aliases: [python3]}
