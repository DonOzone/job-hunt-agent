name: Marketplace release artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Expected X.Y.Z version (blank uses the selected ref's project version)"
        required: false
        type: string
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/marketplace-release.yml"
      - "packaging/**"
      - "tools/**"
      - "src/**"
      - "tests/test_release_packaging.py"
      - "pyproject.toml"
      - "uv.lock"
      - "AGENTS.md"
      - "README.md"
      - "LICENSE"
      - "MANIFEST.in"
      - "docs/**"
      - ".github/skills/**"
      - "config/*.example.yaml"
      - "examples/**"
      - "imports/**"
      - ".env.example"
      - "package.json"
      - "package-lock.json"
      - "apps/web/**"
      - "packages/client/**"
      - "scripts/package-ui.mjs"

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    outputs:
      version: ${{ steps.package.outputs.version }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --all-extras
      - run: uv run ruff check src tests scripts tools
      - run: uv run pytest -q tests/test_release_packaging.py
      - run: uv build
      - run: uv run python scripts/check-distributions.py dist
      - name: Build skill ZIPs and checksums
        id: package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TAG_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if ($env:TAG_RELEASE -eq "true") {
            $version = $env:RELEASE_TAG.Substring(1)
            if ($env:REQUESTED_VERSION -and $env:REQUESTED_VERSION -ne $version) {
              throw "Requested version does not match the selected tag."
            }
            uv run python tools/build_release.py --expected-version $version
          } elseif ($env:REQUESTED_VERSION) {
            uv run python tools/build_release.py --expected-version $env:REQUESTED_VERSION
          } else {
            uv run python tools/build_release.py
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = uv run python -c "from tools.build_release import ROOT, version; print(version(ROOT))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "version=$version" >> $env:GITHUB_OUTPUT
      - run: uv run python tools/smoke_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: job-hunt-agent-${{ steps.package.outputs.version }}-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --all-extras
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -q

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: job-hunt-agent-${{ needs.build.outputs.version }}-ubuntu-latest
          path: dist
      - name: Create release with downloadable assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes \
            --title "job-hunt-agent $RELEASE_TAG"
